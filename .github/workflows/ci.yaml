name: "CI - CooldownManagerClassic"

# Checks only. Nothing here packages or publishes.
#
# The release workflow (main.yaml) runs the same two gates before uploading, but
# it only fires on a v*.*.* tag -- so before this existed the first time anyone
# saw a lint failure was halfway through a release, with the CurseForge upload
# already committed to. This runs them on every push instead.
# Push only, on every branch. A pull_request trigger as well meant two identical
# runs of the same commit for any branch with a PR open, and the PR shows the
# push run's result anyway.
on:
  push:
    branches: ["**"]
    # Tag pushes are already covered by the release workflow.
    tags-ignore: ["**"]

# A newer push makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # These gates take about a minute. Anything approaching this is stuck, not
    # slow: an apt mirror once hung mid-`update` and the run sat there for 48
    # minutes until it was cancelled by hand, which is a runner burning time and
    # a PR whose checks never resolve. Sized to clear the step budgets below
    # (8 + 5) so this only ever fires as a backstop for something they miss.
    timeout-minutes: 14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up scripts
        run: chmod +x ./ci/scripts/lint.sh

      - name: Lint
        timeout-minutes: 8
        run: |
          # Retried once: a mirror that stalls or 503s on the first fetch is the
          # single most common way this job fails for reasons that are not ours.
          # Each attempt is bounded because a stalled mirror hangs rather than
          # failing, and a bare `||` waits on it forever -- two runs burned the
          # whole step budget inside one silent `apt-get update` that way.
          # Worst case is 3 commands x 2 x (60s + 5s) = 6m30s, inside the step
          # timeout below.
          retry() {
            for attempt in 1 2; do
              timeout 60 "$@" && return 0
              echo "attempt $attempt failed: $*"
              sleep 5
            done
            return 1
          }
          retry sudo apt-get update -qq
          retry sudo apt-get install -y --no-install-recommends luarocks
          retry sudo luarocks install luacheck
          ./ci/scripts/lint.sh

      # Catches what a parse cannot: load-order mistakes, nil child widgets, and
      # API branches that are never taken until someone reloads in game.
      - name: Smoke test
        timeout-minutes: 5
        run: |
          python -m pip install --quiet lupa luaparser
          python ci/scripts/check_globals.py
          python ci/tests/smoke_test.py
